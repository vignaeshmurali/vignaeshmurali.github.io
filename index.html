<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<meta name="description" content="Vignaesh Murali — Founder, Zen & Dynamics. Connect, save contact, and explore Zen & Dynamics.">
<title>Vignaesh Murali | Coach Tarzan</title>

<style>
:root {
    --gold: #e6b558;
    --bg: #0f0f0f;
    --card: #1d1d1d;
    --border: #303030;
    --muted: #a9a9a9;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background:
        radial-gradient(circle at top, rgba(230,181,88,.10), transparent 30%),
        var(--bg);
    color: #fff;
    min-height: 100vh;
    padding: 30px 18px 34px;
}
.container { width: 100%; max-width: 460px; margin: 0 auto; text-align: center; }
.logo { width: 205px; max-width: 72%; height: auto; margin: 2px auto 20px; display:block; }
.profile {
    width: 128px;
    height: 128px;
    object-fit: cover;
    object-position: center top;
    border-radius: 50%;
    border: 3px solid var(--gold);
    display: block;
    margin: 0 auto 18px;
    background: #fff;
}
h1 { font-size: 28px; line-height: 1.15; margin-bottom: 5px; letter-spacing: -.3px; }
.subtitle { color: #d0d0d0; font-size: 16px; margin-bottom: 7px; }
.company { color: var(--gold); font-size: 15px; font-weight: 650; margin-bottom: 28px; }
.section-title {
    text-align: left; font-size: 11px; color: #777;
    text-transform: uppercase; letter-spacing: 1.7px;
    margin: 24px 2px 10px;
}
.button {
    display: flex; align-items: center; justify-content: center;
    width: 100%; min-height: 55px; margin: 11px 0;
    padding: 15px 18px; border-radius: 13px;
    text-decoration: none; font-size: 16px; font-weight: 650;
    transition: transform .15s ease, background .15s ease;
}
.button:hover { transform: translateY(-2px); }
.primary { background: var(--gold); color: #111; }
.secondary { background: var(--card); color: #fff; border: 1px solid var(--border); }
.brochure { background: var(--gold); color: #111; margin-top: 14px; }
.icon { width: 24px; margin-right: 10px; text-align:center; }
.footer { margin-top: 30px; color: #606060; font-size: 11px; }
.footer span { color: var(--gold); }
@media (max-width: 380px) {
    body { padding-top: 22px; }
    h1 { font-size: 25px; }
    .profile { width: 112px; height: 112px; }
}
</style>
</head>

<body>
<div class="container">

    <img class="logo" src="logo.png" alt="Zen & Dynamics">

    <img class="profile" src="profile.png" alt="Vignaesh Murali">

    <h1>Vignaesh Murali</h1>
    <div class="subtitle">Coach Tarzan</div>
    <div class="company">Founder · Zen & Dynamics</div>

    <div class="section-title">Connect</div>

    <a class="button primary" href="vignaesh-murali.vcf" download>
        <span class="icon">＋</span> Save My Contact
    </a>

    <a class="button secondary" href="https://wa.me/917448307910">
        <span class="icon">◉</span> WhatsApp
    </a>

    <a class="button secondary" href="https://www.instagram.com/coach.tarzan/" target="_blank" rel="noopener">
        <span class="icon">◎</span> Instagram
    </a>

    <a class="button secondary" href="https://in.linkedin.com/in/vignaesh-murali-5b967518b" target="_blank" rel="noopener">
        <span class="icon">in</span> LinkedIn
    </a>

    <div class="section-title">Zen & Dynamics</div>

    <a class="button secondary" href="https://www.zenanddynamics.in/" target="_blank" rel="noopener">
        <span class="icon">↗</span> Zen & Dynamics Website
    </a>

    <a class="button brochure" href="brochure.pdf" download>
        <span class="icon">↓</span> Download Z&D Brochure
    </a>

    <div class="footer">Built for <span>Zen & Dynamics</span></div>
</div>
</body>
</html>
