<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vignaesh Murali | Coach Tarzan</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #111111;
            color: #ffffff;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            text-align: center;
        }

        .logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 18px;
            background: #e6b558;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            margin-right: auto;
            font-size: 22px;
            font-weight: 700;
            color: #111111;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .subtitle {
            color: #bdbdbd;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .company {
            color: #e6b558;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 28px;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 54px;
            margin: 12px 0;
            padding: 15px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.15s ease;
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .primary {
            background: #e6b558;
            color: #111111;
        }

        .secondary {
            background: #222222;
            color: #ffffff;
            border: 1px solid #333333;
        }

        .brochure {
            margin-top: 25px;
            background: #e6b558;
            color: #111111;
        }

        .section-title {
            text-align: left;
            font-size: 12px;
            color: #777777;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 28px 0 10px;
        }

        .footer {
            margin-top: 35px;
            font-size: 12px;
            color: #666666;
        }

        .footer span {
            color: #e6b558;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        Z&D
    </div>

    <h1>Vignaesh Murali</h1>

    <div class="subtitle">
        Coach Tarzan
    </div>

    <div class="company">
        Co-founder · Zen & Dynamics
    </div>


    <div class="section-title">
        Connect
    </div>

    <a class="button primary"
       href="tel:+91XXXXXXXXXX">
        ☎ Save / Call
    </a>

    <a class="button secondary"
       href="https://wa.me/91XXXXXXXXXX">
        WhatsApp
    </a>

    <a class="button secondary"
       href="https://www.instagram.com/YOURINSTAGRAM/"
       target="_blank">
        Instagram
    </a>

    <a class="button secondary"
       href="https://www.linkedin.com/in/YOURLINKEDIN/"
       target="_blank">
        LinkedIn
    </a>


    <div class="section-title">
        Zen & Dynamics
    </div>

    <a class="button secondary"
       href="https://YOUR-ZND-WEBSITE.com"
       target="_blank">
        Zen & Dynamics Website
    </a>

    <a class="button brochure"
       href="brochure.pdf"
       download>
        ↓ Download Z&D Brochure
    </a>


    <div class="footer">
        Built for <span>Zen & Dynamics</span>
    </div>

</div>

</body>
</html>
